name: ERP Windows validation
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/**'
      - 'YAYIN_ONAYI.txt'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get exact source and patches
        shell: bash
        run: |
          git init checkout
          git -C checkout remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C checkout fetch --depth 1 origin "$GITHUB_SHA"
          git -C checkout checkout --detach FETCH_HEAD
          python -m zipfile -e checkout/source/MiaPaxERP-source.zip checkout/source
          python -m zipfile -e checkout/source/MiaPaxERP-patch.zip checkout/source
          python -m zipfile -e checkout/source/MiaPaxERP-fix.zip checkout/source
      - name: Build and verify Android package
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          python checkout/.github/build-android.py
      # İmzasız APK, imza doğrulaması başarısız olsa da indirilebilsin: yayıncı yerelde Imzala.ps1 ile imzalar.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-291-unsigned
          path: release/android/MiaPaxERP-Mobil-v2.9.8-imzasiz.apk
          if-no-files-found: warn
      # İmzasız APK'yı yayıncının yerel imzalaması için ayrı bir dala da koyar (artefakt indirmesi oturum gerektirir).
      - name: Share unsigned APK for publisher signing
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=release/android/MiaPaxERP-Mobil-v2.9.8-imzasiz.apk
          [ -f "$f" ] || exit 0
          git init -q apk-share && cp "$f" apk-share/ && cd apk-share
          sha256sum *.apk > SHA256SUMS.txt
          git -c user.name=github-actions -c user.email=actions@github.com checkout -q -b android-imzasiz
          git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Unsigned Android build of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/android-imzasiz
  windows-sql-tls:
    needs: android-build
    # Geliştirme sırasında imzalı APK henüz yokken de Windows derleme/testleri çalışsın; yayın yine Android onayı ister.
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      MIAPAX_TEST_SQL: 'Server=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=true;Encrypt=true;TrustServerCertificate=true;Pooling=false;Connect Timeout=10'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Get the exact development source
        shell: pwsh
        run: |
          git init checkout
          git -C checkout remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git -C checkout fetch --depth 1 origin "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          git -C checkout checkout --detach FETCH_HEAD
          $actual = git -C checkout rev-parse HEAD
          if ($actual -ne $env:GITHUB_SHA) { throw 'Validation checkout mismatch' }
          Expand-Archive -LiteralPath checkout/source/MiaPaxERP-source.zip -DestinationPath checkout/source -Force
          Expand-Archive -LiteralPath checkout/source/MiaPaxERP-patch.zip -DestinationPath checkout/source -Force
          Expand-Archive -LiteralPath checkout/source/MiaPaxERP-fix.zip -DestinationPath checkout/source -Force
      - name: Restore pinned PDF renderer
        run: python checkout/.github/restore-pdfjs.py
      - name: Test irrigation alignment and PDF plan geometry
        run: node --test checkout/source/MiapaxERP.Desktop/Assets/KrokiWeb/tests/designer.test.mjs checkout/source/MiapaxERP.Desktop/Assets/KrokiWeb/tests/ai-project.test.mjs checkout/source/MiapaxERP.Desktop/Assets/KrokiWeb/tests/kroki-cap.test.mjs
      - name: Test field map browser logic
        run: node --test checkout/source/MiapaxERP.Tests.Saha/field286.test.mjs
      - name: Start isolated SQL LocalDB
        shell: pwsh
        run: |
          $localDb = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Filter SqlLocalDB.exe -Recurse | Select-Object -First 1
          if ($null -eq $localDb) { throw 'SQL LocalDB is unavailable on this runner' }
          & $localDb.FullName start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'SQL LocalDB failed to start' }
      - name: Build the complete solution
        shell: pwsh
        run: dotnet build checkout/source/MiapaxERP.slnx --disable-build-servers -m:1 -p:NuGetAudit=false
      - name: Render theme screenshots
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Her tema ayrı süreçte çizilir; biri takılırsa diğerleri etkilenmez.
          $out = Join-Path $env:RUNNER_TEMP 'tema-goruntuleri'
          foreach ($t in 'Nane Cam','Okyanus Cam','Lavanta Cam','Gün Batımı Cam','Gece Cam','Açık','Doğal') {
            $p = Start-Process dotnet -ArgumentList @('run','--project','checkout/source/MiapaxERP.Tests.UzakCalisma/MiapaxERP.Tests.UzakCalisma.csproj','--no-build','--','--tema-render',"`"$out`"","`"$t`"") -NoNewWindow -PassThru
            if (-not $p.WaitForExit(150000)) { try { $p.Kill($true) } catch {}; Write-Host "ZAMAN ASIMI $t" }
          }
      - name: Upload theme screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tema-goruntuleri
          path: ${{ runner.temp }}/tema-goruntuleri
          if-no-files-found: ignore
      # Görüntüler yayıncının inceleyebilmesi için ayrı bir dala da konur (müşteri verisi içermez; SQL'siz önizleme).
      - name: Share theme screenshots
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'tema-goruntuleri'
          if (-not (Test-Path $d)) { exit 0 }
          Set-Location $d
          git init -q
          git -c user.name=github-actions -c user.email=actions@github.com checkout -q -b tema-goruntuleri
          git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Theme screenshots of $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:refs/heads/tema-goruntuleri
      - name: Run rules, UI rendering, real TLS and isolated SQL transactions
        shell: pwsh
        run: dotnet test checkout/source/MiapaxERP.Tests.HTTPS.Integration/MiapaxERP.Tests.HTTPS.Integration.csproj --no-restore --disable-build-servers -m:1 -p:NuGetAudit=false --logger 'console;verbosity=normal'
      - name: Verify all registered HTTPS service routes
        shell: pwsh
        run: dotnet run --project checkout/source/MiapaxERP.Tests.UzakCalisma/MiapaxERP.Tests.UzakCalisma.csproj --no-build



      - name: Verify e-document provider and credential protection
        shell: pwsh
        run: dotnet run --project checkout/source/MiapaxERP.Tests.EBelge/MiapaxERP.Tests.EBelge.csproj --no-build
      - name: Full regression suites (accounting, payroll, UI, modules)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $fails = @()
          dotnet test checkout/source/MiapaxERP.Tests/MiapaxERP.Tests.csproj --no-build --disable-build-servers -m:1 -p:NuGetAudit=false --logger 'console;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { $fails += 'MiapaxERP.Tests' }
          # Arayuz: etkileşimli pencere; Magaza: canlı panel sunucusu; Modul180/200: yalnız önizleme (lisanssız) derlemesi için.
          foreach ($p in 'Muhasebe','KrokiStok','Laboratuvar','TemaTakvim','WebYonetimi') {
            Write-Host "=== SUITE $p ==="
            $out = Join-Path $env:RUNNER_TEMP "$p.out"; $err = Join-Path $env:RUNNER_TEMP "$p.err"
            $proc = Start-Process dotnet -ArgumentList @('run','--project',"checkout/source/MiapaxERP.Tests.$p/MiapaxERP.Tests.$p.csproj",'--no-build') -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $proc.WaitForExit(300000)) { try { $proc.Kill($true) } catch {}; $fails += "$p (zaman asimi)" }
            elseif ($proc.ExitCode -ne 0) { $fails += $p }
            Get-Content $out -Tail 12 -ErrorAction SilentlyContinue
            Get-Content $err -Tail 30 -ErrorAction SilentlyContinue
          }
          Write-Host "SUITE_FAILS: $($fails -join ', ')"
          if ($fails.Count -gt 0) { exit 1 }
      - name: Verify updater installation and rollback
        shell: pwsh
        run: dotnet run --project checkout/source/MiapaxERP.Tests.Guncelleme/MiapaxERP.Tests.Guncelleme.csproj --no-build -- checkout/source
      - uses: actions/download-artifact@v4
        with:
          name: android-291-unsigned
          path: release/android
      - name: Build packages and publish validated main release
        if: needs.android-build.result == 'success' && hashFiles('checkout/YAYIN_ONAYI.txt') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./checkout/.github/publish-release.ps1
